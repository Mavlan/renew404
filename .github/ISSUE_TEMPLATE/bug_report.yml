name: Bug report / 问题反馈
description: Report a reproducible problem without including private subscription data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Renew404. Please remove names, prices, dates, account details, and exported backup contents from screenshots or logs.

  - type: dropdown
    id: environment
    attributes:
      label: Environment / 使用环境
      options:
        - Public demo / 在线版本
        - Self-hosted / 自行部署
        - Local development / 本地开发
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / 版本
      placeholder: 1.1.0
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and browser / 设备与浏览器
      placeholder: iPhone 15, iOS 19, Safari PWA
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: Describe the shortest sequence that triggers the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期表现
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际表现
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Data compatibility notes / 数据兼容说明
      description: Did this involve an old IndexedDB database, JSON import, update, or offline launch? Do not attach a real backup.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私检查
      options:
        - label: I removed personal subscription data and credentials from this report.
          required: true
